# GPT-2 预训练配置 - 使用打包式数据流（无 padding）
# 此配置实现方案2：shuffle buffer + token packing + residual carry-over

model:
  model_config_path: configs/model/gpt_125m.yaml
  tokenizer_name_or_path: Qwen/Qwen2.5-0.5B
  use_flash_attention: false

data:
  # 数据源配置
  data_sources:
    - path: /home/modelenv/chentianxuan/projects/open_source_data_process/data/chinanews_pretrain.jsonl
      type: local
      name: chinanews_pretrain
  
  # 打包式预训练配置
  pack_sequences: true              # 启用打包模式
  shuffle_buffer_size: 5000         # shuffle buffer 大小
  sequence_length: 1024             # 固定序列长度
  
  # 传统配置（打包模式下不生效）
  add_bos: false                    # 打包模式下不需要每个样本都有 BOS
  add_eos: false                    # 由打包逻辑自动添加 EOS 作为分隔符
  padding: do_not_pad               # 打包模式下不需要 padding

# 优化器（脚本读取顶层 optimizer）
optimizer:
  name: adamw
  lr: 5.0e-5
  weight_decay: 0.01
  betas: [0.9, 0.95]
  eps: 1.0e-8

# 学习率调度器（脚本读取顶层 scheduler，仅支持 cosine）
scheduler:
  name: cosine
  warmup_steps: 500
  min_lr: 0.0

training:
  output_dir: ./checkpoints/gpt2_pretrain_packed
  max_epochs: 1
  max_steps: 60000
  save_steps: 10000
  
  # 批次配置（优化显存使用）
  micro_batch_size: 6               # 每张卡的 batch size (降低以适应 24GB 显存)
  gradient_accumulation: 6          # 梯度累积步数 (增加以保持有效 batch size)
  # 有效 batch size = micro_batch_size × gradient_accumulation × num_gpus
  # 例如: 6 × 6 × 1 = 36 (与原配置相同)
  
  # 可选：梯度裁剪阈值（当前脚本未读取，仅保留作记录）
  max_grad_norm: 1.0
  
  # 日志
  logging_steps: 10
  eval_interval: 200                # 每 200 步进行生成评估
  
  # 混合精度训练
  use_amp: true
  
  # 分布式配置
  ddp: false                        # 单卡训练设为 false
  local_rank: -1

# 生成评估配置
evaluation:
  prompts:
    - "新华社北京"
    - "中国经济正处于"
    - "在未来的科技创新领域"
    - "X1哥是一个"
    - "china is in the age of "
  max_new_tokens: 1024
  temperature: 0.8
  top_p: 0.9
  top_k: 50
  repetition_penalty: 1.1

# 其他配置
seed: 42
