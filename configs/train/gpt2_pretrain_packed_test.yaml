# GPT-2 预训练配置 - 测试版（使用小数据集）

model:
  model_config_path: configs/model/gpt_125m.yaml
  tokenizer_name_or_path: Qwen/Qwen2.5-0.5B
  use_flash_attention: false

data:
  data_sources:
    - path: /tmp/test_pretrain_small.jsonl
      type: local
      name: test_small
  
  pack_sequences: true
  shuffle_buffer_size: 50
  sequence_length: 512
  
  add_bos: false
  add_eos: false
  padding: do_not_pad

training:
  output_dir: ./checkpoints/gpt2_pretrain_packed_test
  num_train_epochs: 1
  
  micro_batch_size: 2
  gradient_accumulation: 2
  
  learning_rate: 5.0e-5
  weight_decay: 0.01
  max_grad_norm: 1.0
  
  warmup_steps: 10
  lr_scheduler_type: cosine
  
  save_steps: 100
  logging_steps: 5
  eval_steps: 50
  
  use_amp: true
  ddp: false
  local_rank: -1

seed: 42
