# GPT-2 指令微调配置（ChinaNews 数据）- 修复版本
# 
# 修复内容：
# 1. 降低学习率从2e-4到1e-4
# 2. 修正scheduler的total_steps与实际训练步数匹配
# 3. 增加更多数据量
# 4. 增加训练epoch数
# 5. 添加更频繁的评估
# 6. 添加repetition_penalty

run_name: "gpt2_sft_chinanews_fixed"
seed: 1234

trainer:
  type: "sft"

model:
  model_config_path: "/home/modelenv/chentianxuan/projects/llm/AnotherLLMFromScratch/configs/model/gpt_125m.yaml"
  tokenizer_name_or_path: "Qwen/Qwen2-0.5B"

optimizer:
  name: "adamw"
  lr: 3.0e-5          # 再次降低学习率（应对数据重复pattern）
  betas: [0.9, 0.95]
  weight_decay: 0.15  # 增加weight decay
  eps: 1.0e-8

scheduler:
  name: "cosine"
  warmup_steps: 1000    # 增加warmup
  total_steps: 50000    # 2 epochs × 25000 steps
  min_lr: 1.0e-6

training:
  max_epochs: 2         # 增加到2个epoch
  micro_batch_size: 2
  gradient_accumulation: 32
  max_grad_norm: 1.0
  use_amp: true
  save_dir: "./checkpoints/gpt2_sft_chinanews_fixed"
  log_interval: 10
  eval_interval: 1000   # 更频繁的评估

data:
  type: "local"
  path: "/home/modelenv/chentianxuan/projects/open_source_data_process/data/chinanews_pretrain.jsonl"
  sequence_length: 1024
  tokenizer_batch_size: 2048
  num_workers: 4
  prefetch_factor: 2
  shuffle: true
  max_samples: 1600000  # 增加数据量

evaluation:
  prompts:
    - "中国经济正处于"
    - "在未来的科技创新领域"
    - "china is one the age of "
  max_new_tokens: 120
  temperature: 0.8
  top_k: 50
  top_p: 0.9
  repetition_penalty: 1.2
